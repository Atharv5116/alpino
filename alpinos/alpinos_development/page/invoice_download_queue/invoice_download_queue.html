<style>
.invoice-download-queue .idq-bar {
	display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-end;
	margin-bottom: 10px;
}
.invoice-download-queue .idq-bar .idq-f { min-width: 150px; flex: 0 0 auto; }
.invoice-download-queue .idq-bar .idq-f.wide { min-width: 200px; }
.invoice-download-queue .idq-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.invoice-download-queue .idq-count { font-size: 12px; color: var(--text-muted); }

.invoice-download-queue .idq-scroll { overflow-x: auto; max-width: 100%; }
.invoice-download-queue .idq-table { font-size: 12px; margin-bottom: 0; width: 100%; }
.invoice-download-queue .idq-table th,
.invoice-download-queue .idq-table td { padding: 5px 7px; vertical-align: middle; white-space: nowrap; }
.invoice-download-queue .idq-table th { background: var(--bg-color); font-weight: 600; }

/* Sorting: the header is the control, so it has to look like one and show state. */
.invoice-download-queue .idq-table th.idq-sortable { cursor: pointer; user-select: none; }
.invoice-download-queue .idq-table th.idq-sortable:hover { color: var(--text-color); }
.invoice-download-queue .idq-sort-arrow { margin-left: 4px; opacity: .35; font-size: 11px; }
.invoice-download-queue .idq-table th.idq-sorted .idq-sort-arrow { opacity: 1; color: var(--primary); }
.invoice-download-queue .idq-table th.idq-sorted { color: var(--text-color); }

/* The Download column is an action and is pinned first. It is not draggable and has
   no sort, because there is nothing in it to order by. */
.invoice-download-queue .idq-dl-col { text-align: center; }
.invoice-download-queue .idq-dl-sep { margin: 0 4px; color: var(--text-muted); }
.invoice-download-queue .idq-dl-off { opacity: .4; }
.invoice-download-queue .idq-check-col { width: 30px; text-align: center; }

.invoice-download-queue .idq-num { text-align: right; }
/* Undispatched Items / Qty: kept narrow, the full list opens in a pop-up. */
.invoice-download-queue .idq-table td.idq-und { max-width: 170px; width: 170px; }
.invoice-download-queue .idq-table th[data-key="undispatched"] { white-space: normal; min-width: 110px; max-width: 170px; }
.invoice-download-queue .idq-und-link { display: inline-flex; align-items: center; gap: 4px; max-width: 160px; color: var(--text-color); }
.invoice-download-queue .idq-und-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.invoice-download-queue .idq-und-more { flex: 0 0 auto; font-size: 11px; padding: 0 5px; border-radius: 8px; background: var(--bg-gray, #eceff1); color: var(--text-muted); }
.invoice-download-queue .idq-empty { padding: 26px 12px; text-align: center; color: var(--text-muted); }

/* Column picker: what is shown (ordered) on the left, what can be added on the right. */
.idq-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 767px) { .idq-picker { grid-template-columns: 1fr; } }
.idq-picker-title { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
.idq-picker-hint { font-size: 12px; margin-bottom: 8px; }
.idq-shown-list { max-height: 55vh; overflow-y: auto; }
.idq-available { max-height: 50vh; overflow-y: auto; margin-top: 8px; }
.idq-group-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
	color: var(--text-muted); margin: 10px 0 4px; }
.idq-add-item { padding: 4px 8px; font-size: 13px; border-radius: 4px; cursor: pointer; }
.idq-add-item:hover { background: var(--bg-light-gray, var(--bg-color)); }
.idq-add-plus { display: inline-block; width: 16px; color: var(--text-muted); font-weight: 600; }
.idq-col-remove { color: var(--text-muted); font-size: 16px; line-height: 1; padding: 0 4px; }
.idq-col-remove:hover { color: var(--red-500, #e03636); text-decoration: none; }
.idq-col-item {
	display: flex; align-items: center; gap: 8px; padding: 5px 8px;
	border: 1px solid var(--border-color); border-radius: 4px; margin-bottom: 5px;
	background: var(--card-bg); cursor: grab;
}
.idq-col-item.idq-locked { opacity: .6; cursor: not-allowed; background: var(--bg-color); }
.idq-col-item .idq-col-handle { color: var(--text-muted); font-size: 11px; }
.idq-col-item .idq-col-label { flex: 1; font-size: 13px; }
</style>
<div class="invoice-download-queue">

	<div class="idq-bar">
		<div class="idq-f fld-channel"></div>
		<div class="idq-f fld-order-date-from"></div>
		<div class="idq-f fld-order-date-to"></div>
		<div class="idq-f fld-dispatch-date-from"></div>
		<div class="idq-f fld-dispatch-date-to"></div>
		<div class="idq-f fld-customer-type"></div>
		<div class="idq-f fld-sales-order"></div>
		<div class="idq-f fld-customer-po-no"></div>
		<div class="idq-f fld-po-date"></div>
		<div class="idq-f wide fld-customer"></div>
		<div class="idq-f fld-created-by"></div>
		<div class="idq-f fld-invoice-id"></div>
		<div class="idq-f fld-lr-number"></div>
		<div class="idq-f fld-state"></div>
		<div class="idq-actions">
			<button class="btn btn-sm btn-primary btn-idq-apply">Apply</button>
			<button class="btn btn-sm btn-default btn-idq-clear">Clear</button>
			<span class="idq-count"></span>
		</div>
	</div>

	<div class="idq-scroll">
		<table class="table table-bordered idq-table">
			<thead><tr></tr></thead>
			<tbody></tbody>
		</table>
	</div>

	<div class="alp-actions" style="margin-top:10px;display:flex;gap:8px;align-items:center;">
		<button class="btn btn-sm btn-default btn-idq-prev">Previous</button>
		<button class="btn btn-sm btn-default btn-idq-next">Next</button>
		<span class="text-muted idq-range" style="font-size:12px;"></span>
	</div>
</div>
